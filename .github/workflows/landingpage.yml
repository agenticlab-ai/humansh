name: Landing page

# The landing page had no CI of any kind, while Dependabot was already merging
# npm updates into it. This workflow closes that gap: it runs the exact command
# `npm run deploy:cloudflare` runs, so a dependency bump that breaks the build
# fails here instead of at deploy time.
on:
  push:
    paths:
      - "landingpage/**"
      - ".github/workflows/landingpage.yml"
  pull_request:
    paths:
      - "landingpage/**"
      - ".github/workflows/landingpage.yml"

permissions:
  contents: read

concurrency:
  group: landingpage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Both ends of the supported range in landingpage/package.json
    # ("^22.13.0 || >=24"). Testing only the newest would hide a dependency that
    # quietly drops support for the lower bound, which is exactly the failure an
    # automated bump introduces. fail-fast is off so a break on one version does
    # not mask the result on the other.
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    name: build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: landingpage/package-lock.json

      # Delegating to the deploy script rather than restating its steps keeps CI
      # and deployment from drifting apart: this installs from the lockfile,
      # lints, server-renders the page under test, and bundles the Cloudflare
      # Worker. --dry-run stops before the Worker is uploaded and needs no
      # credentials, so it is safe to run on pull requests from forks.
      - name: Install, lint, test, and bundle the Worker
        working-directory: landingpage
        run: sh scripts/deploy-cloudflare.sh --dry-run

      # The bundle is the artefact deployment actually ships, so assert it
      # exists rather than trusting the script's exit status alone.
      - name: Verify the built Worker bundle and client assets exist
        working-directory: landingpage
        run: |
          test -f dist/server/wrangler.json || { echo "missing dist/server/wrangler.json"; exit 1; }
          test -s dist/server/index.js || { echo "missing or empty dist/server/index.js"; exit 1; }
          assets=$(find dist/client -type f 2>/dev/null | wc -l | tr -d ' ')
          # A bare directory check would pass on an empty dist, which is the
          # shape a half-failed build leaves behind.
          if [ "$assets" -lt 1 ]; then
            echo "dist/client contains no files"
            exit 1
          fi
          echo "worker bundle present; client assets: $assets"
